<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thời tiết biển">
<meta name="theme-color" content="#f4f7f9">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Thời tiết tuyến biển</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Bố cục: một cột. Tuyến → ô trạng thái lớn của ngày đang chọn → dải 7 ngày (bấm chọn ngày) → danh sách điểm (bấm mở chi tiết) → thông báo */
:root{
  --nen:#f4f7f9; --the:#ffffff; --chu:#0f2233; --mo:#6b7f90; --vien:#e3eaef; --nhan:#0a5c8a;
  --em:#1b8a68; --em-nhat:#e3f4ed;
  --dong:#c27400; --dong-nhat:#fdf1dc;
  --manh:#c8372d; --manh-nhat:#fde6e3;
  --font:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --nen:#0b141c; --the:#131f2a; --chu:#e4edf3; --mo:#8599a9; --vien:#1f2f3c; --nhan:#62b6e8;
  --em:#5fd0a8; --em-nhat:#12352b; --dong:#f2b34f; --dong-nhat:#382910; --manh:#ff8378; --manh-nhat:#421f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --nen:#0b141c; --the:#131f2a; --chu:#e4edf3; --mo:#8599a9; --vien:#1f2f3c; --nhan:#62b6e8;
  --em:#5fd0a8; --em-nhat:#12352b; --dong:#f2b34f; --dong-nhat:#382910; --manh:#ff8378; --manh-nhat:#421f1b; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nen);color:var(--chu);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.khung{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:24px}
.so{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--nhan);outline-offset:3px;border-radius:6px}
a{color:var(--nhan);text-decoration:none;font-weight:600}

/* Đầu trang */
.dau{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tuyen{display:flex;align-items:center;gap:6px;min-width:0;font-size:17px;font-weight:600}
.chon{position:relative;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 0}
.chon select{position:absolute;inset:0;width:100%;opacity:0;font-size:16px;cursor:pointer}
.chon:focus-within{outline:2px solid var(--nhan);outline-offset:3px;border-radius:6px}
.tuyen .mui{color:var(--mo);font-weight:400}
.lammoi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mo);flex:none}
.lammoi svg{width:20px;height:20px}
.lammoi.quay svg{animation:quay 1s linear infinite}
@keyframes quay{to{transform:rotate(360deg)}}

/* Ô trạng thái */
.tt{border-radius:22px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px}
.tt.m0{background:var(--em-nhat)} .tt.m1{background:var(--dong-nhat)} .tt.m2{background:var(--manh-nhat)}
.tt-ngay{font-size:13px;font-weight:500;color:var(--mo)}
.tt-chu{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.m0 .tt-chu{color:var(--em)} .m1 .tt-chu{color:var(--dong)} .m2 .tt-chu{color:var(--manh)}
.tt-phu{font-size:15px;color:var(--chu)}

/* Dải 7 ngày */
.bay{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.ngay{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px}
.ngay .thu{font-size:12px;font-weight:500;color:var(--mo)}
.ngay .so{font-size:14px;font-weight:600}
.ngay[aria-pressed="true"]{background:var(--the);box-shadow:0 1px 3px rgba(15,34,51,.08)}
.ngay[aria-pressed="true"] .thu{color:var(--chu)}
.cham{width:8px;height:8px;border-radius:50%;flex:none}
.c0{background:var(--em)} .c1{background:var(--dong)} .c2{background:var(--manh)}

/* Danh sách điểm */
.ds{background:var(--the);border-radius:18px;overflow:hidden}
.diem + .diem{border-top:1px solid var(--vien)}
.hang{width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;text-align:left}
.hang .ten{flex:1;min-width:0;font-weight:500}
.hang .so{font-weight:600}
.hang .don{color:var(--mo);font-weight:400;font-size:13px;margin-left:2px}
.chi-tiet{padding:0 18px 16px 38px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.nhanh{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mo)}
.nhanh b{color:var(--chu);font-weight:600}
.gio-list{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;color:var(--mo)}
.gio-list .so{color:var(--chu)}
.gio-list .canh{color:var(--dong);font-weight:600}

.chu-giai{font-size:12px;color:var(--mo);display:flex;gap:14px;flex-wrap:wrap;margin-top:-12px}
.chu-giai span{display:inline-flex;align-items:center;gap:6px}

/* Thông báo */
.tb{background:var(--the);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tb h2{font-size:16px;margin:0;font-weight:600}
.buoc{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--mo);margin:0;padding-left:20px}
.buoc b{color:var(--chu);font-weight:600}
.kenh{display:flex;align-items:center;gap:8px;background:var(--nen);border-radius:12px;padding:10px 12px;font-size:14px}
.kenh code{flex:1;min-width:0;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;color:var(--chu)}
.kenh button{color:var(--nhan);font-weight:600;font-size:14px}

.loi{font-size:14px;color:var(--manh)}
.chan{font-size:12px;color:var(--mo);text-align:center;line-height:1.6}
@media (prefers-reduced-motion:reduce){.lammoi.quay svg{animation:none}}
</style>
</head>
<body>
<div class="khung">
  <div class="dau">
    <div class="tuyen">
      <span class="chon"><span id="tu-ten">Vũng Tàu</span><select id="tu" aria-label="Cảng đi"></select></span>
      <button class="mui" id="doi" type="button" aria-label="Đổi chiều">→</button>
      <span class="chon"><span id="den-ten">Hải Phòng</span><select id="den" aria-label="Cảng đến"></select></span>
    </div>
    <button class="lammoi" id="lammoi" type="button" aria-label="Làm mới">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>

  <div id="loi" class="loi" hidden></div>

  <div class="tt m0" id="tt">
    <div class="tt-ngay" id="tt-ngay">Hôm nay</div>
    <div class="tt-chu" id="tt-chu">Đang tải</div>
    <div class="tt-phu so" id="tt-phu">&nbsp;</div>
  </div>

  <div class="bay" id="bay"></div>
  <div class="chu-giai">
    <span><i class="cham c0"></i>Êm</span>
    <span><i class="cham c1"></i>Biển động</span>
    <span><i class="cham c2"></i>Động mạnh</span>
  </div>

  <div class="ds" id="ds"></div>

  <div class="tb">
    <h2>Nhận thông báo</h2>
    <ol class="buoc">
      <li>Cài app <a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">ntfy</a> trên iPhone</li>
      <li>Trong app bấm <b>+</b>, dán tên kênh dưới đây, bấm <b>Subscribe</b></li>
    </ol>
    <div class="kenh"><code id="kenh">tau-bien</code><button type="button" id="chep">Chép</button></div>
    <div class="buoc" style="padding-left:0" id="tb-tuyen"></div>
  </div>

  <div class="chan" id="chan">Mô hình ECMWF, như Windy · <a href="https://nchmf.gov.vn" target="_blank" rel="noopener">Tin bão chính thức</a></div>
</div>

<script src="chung.js"></script>
<script>
'use strict';
var C = window.CHUNG;
var KHOA_DL = 'tbien-du-lieu-2', KHOA_TUYEN = 'tbien-tuyen';
var THU = ['CN','T2','T3','T4','T5','T6','T7'];
var dl = null, tuyenChon = {tu:'vt', den:'hp'}, ngayChon = 0, moRong = {};

function docKho(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function ghiKho(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function hai(n){ return (n < 10 ? '0' : '') + n; }
function gioNay(){ var d = new Date(); return d.getFullYear() + '-' + hai(d.getMonth()+1) + '-' + hai(d.getDate()) + 'T' + hai(d.getHours()) + ':00'; }
function nhanNgay(n){
  var p = n.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  var cach = Math.round((d - new Date(new Date().setHours(0,0,0,0))) / 86400000);
  return {ngan: cach === 0 ? 'Nay' : THU[d.getDay()], dai: cach === 0 ? 'Hôm nay' : cach === 1 ? 'Ngày mai' : (THU[d.getDay()] === 'CN' ? 'Chủ nhật' : 'Thứ ' + ['','','Hai','Ba','Tư','Năm','Sáu','Bảy'][d.getDay()+1]) + ' ' + p[2] + '/' + p[1]};
}
function cacNgay(){
  var ds = [], hn = gioNay().slice(0,10);
  dl.gio.forEach(function(t){ var n = t.slice(0,10); if (n >= hn && ds.indexOf(n) < 0) ds.push(n); });
  return ds;
}
function el(id){ return document.getElementById(id); }

function taiSoLieu(){
  var nut = el('lammoi'); nut.classList.add('quay'); nut.disabled = true;
  var u = C.duongDan();
  function lay(x){ return fetch(x).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
  Promise.all([lay(u.gio), lay(u.song)]).then(function(kq){
    dl = C.gop(kq[0], kq[1]); dl.luc = Date.now(); ghiKho(KHOA_DL, dl);
    el('loi').hidden = true; ve();
  }).catch(function(){
    el('loi').textContent = dl ? 'Không tải được số liệu mới, đang xem bản trước.' : 'Không tải được số liệu. Kiểm tra mạng rồi thử lại.';
    el('loi').hidden = false;
    if (!dl) el('tt-chu').textContent = 'Chưa có số liệu';
  }).then(function(){ nut.classList.remove('quay'); nut.disabled = false; veChan(); });
}

function veChan(){
  var s = 'Mô hình ECMWF, như Windy';
  if (dl) { var d = new Date(dl.luc); s += ' · cập nhật ' + hai(d.getHours()) + ':' + hai(d.getMinutes()); }
  el('chan').innerHTML = s + ' · <a href="https://nchmf.gov.vn" target="_blank" rel="noopener">Tin bão chính thức</a>';
}
function ve(){
  if (!dl) return;
  var diem = C.tuyen(tuyenChon.tu, tuyenChon.den), ngay = cacNgay(), nay = gioNay();
  if (ngayChon >= ngay.length) ngayChon = 0;
  var tt = {};
  diem.forEach(function(p){ tt[p.id] = ngay.map(function(n, j){ return C.tomTat(dl, p.id, n, j === 0 ? nay : null); }); });

  /* Dải 7 ngày */
  el('bay').innerHTML = ngay.map(function(n, j){
    var muc = 0, song = null;
    diem.forEach(function(p){ var t = tt[p.id][j]; muc = Math.max(muc, t.muc); if (t.song != null && (song == null || t.song > song)) song = t.song; });
    return '<button class="ngay" type="button" data-j="' + j + '" aria-pressed="' + (j === ngayChon) + '"><span class="thu">' + nhanNgay(n).ngan +
      '</span><i class="cham c' + muc + '"></i><span class="so">' + C.so(song,1) + '</span></button>';
  }).join('');

  /* Ô trạng thái của ngày đang chọn */
  var j = ngayChon, muc = 0, cao = null, gio = null, dong = [];
  diem.forEach(function(p){ var t = tt[p.id][j]; muc = Math.max(muc, t.muc);
    if (t.muc > 0) dong.push(p.ten);
    if (t.song != null && (!cao || t.song > cao.t.song)) cao = {p:p, t:t};
    if (t.gio != null && (gio == null || t.gio > gio)) gio = t.gio; });
  el('tt').className = 'tt m' + muc;
  el('tt-ngay').textContent = nhanNgay(ngay[j]).dai;
  el('tt-chu').textContent = C.MUC_TEN[muc];
  el('tt-phu').textContent = !cao ? '' : (dong.length ? 'Ở ' + dong.join(', ') + '. ' : '') +
    'Sóng tới ' + C.so(cao.t.song,1) + ' m, gió tới cấp ' + C.capGio(gio) + '.';

  /* Các điểm */
  el('ds').innerHTML = diem.map(function(p){
    var t = tt[p.id][j];
    return '<div class="diem"><button class="hang" type="button" data-id="' + p.id + '" aria-expanded="' + !!moRong[p.id] + '">' +
      '<i class="cham c' + t.muc + '"></i><span class="ten">' + p.ten + '</span><span class="so">' + C.so(t.song,1) + '<span class="don">m</span></span></button>' +
      (moRong[p.id] ? chiTiet(p, ngay[j], t, j === 0 ? nay : null) : '') + '</div>';
  }).join('');
}
function chiTiet(p, ngay, t, tuGio){
  var d = dl.diem[p.id], dong = [];
  dl.gio.forEach(function(g, i){
    if (g.slice(0,10) !== ngay || (tuGio && g < tuGio) || +g.slice(11,13) % 3) return;
    var canh = C.mucGio(d.gio[i], d.giat[i], d.song[i]) > 0 ? ' canh' : '';
    dong.push('<span class="so">' + g.slice(11,13) + 'h</span><span>gió cấp <span class="so' + canh + '">' + C.capGio(d.gio[i]) + '</span> ' + C.tenHuong(d.huong[i]) +
      '</span><span class="so' + canh + '">' + C.so(d.song[i],1) + ' m</span>');
  });
  return '<div class="chi-tiet">' +
    '<div class="nhanh"><span>Gió tới <b>cấp ' + C.capGio(t.gio) + '</b></span><span>Giật <b>cấp ' + C.capGio(t.giat) + '</b></span><span>Mưa <b>' + C.so(t.mua,0) + ' mm</b></span></div>' +
    (dong.length ? '<div class="gio-list">' + dong.join('') + '</div>' : '') +
    '<a href="https://www.windy.com/?waves,' + p.lat + ',' + p.lon + ',8" target="_blank" rel="noopener">Xem trên Windy</a></div>';
}

/* Sự kiện */
el('lammoi').addEventListener('click', taiSoLieu);
['tu','den'].forEach(function(k){ el(k).addEventListener('change', function(e){ tuyenChon[k] = e.target.value; ghiKho(KHOA_TUYEN, tuyenChon); veTuyen(); ve(); }); });
el('doi').addEventListener('click', function(){ var a = tuyenChon.tu; tuyenChon.tu = tuyenChon.den; tuyenChon.den = a; ghiKho(KHOA_TUYEN, tuyenChon); veTuyen(); ve(); });
el('bay').addEventListener('click', function(e){ var b = e.target.closest('.ngay'); if (!b) return; ngayChon = +b.getAttribute('data-j'); ve(); });
el('ds').addEventListener('click', function(e){ var b = e.target.closest('.hang'); if (!b) return; var id = b.getAttribute('data-id'); moRong[id] = !moRong[id]; ve(); });
el('chep').addEventListener('click', function(){
  var t = el('kenh').textContent, b = this;
  function xong(){ b.textContent = 'Đã chép'; setTimeout(function(){ b.textContent = 'Chép'; }, 1500); }
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(xong, function(){});
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden && (!dl || Date.now() - dl.luc > 3600000)) taiSoLieu(); });

function veTuyen(){
  ['tu','den'].forEach(function(k){
    el(k).innerHTML = C.DIEM.map(function(p){ return '<option value="' + p.id + '">' + p.ten + '</option>'; }).join('');
    el(k).value = tuyenChon[k];
    el(k + '-ten').textContent = el(k).options[el(k).selectedIndex].text;
  });
}

/* Khởi động */
(function(){
  var t = docKho(KHOA_TUYEN); if (t && t.tu && t.den) tuyenChon = t;
  veTuyen();
  var luu = docKho(KHOA_DL); if (luu && luu.gio && luu.diem) { dl = luu; ve(); }
  veChan();
  if (!dl || Date.now() - dl.luc > 3600000) taiSoLieu();
  fetch('cau-hinh.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(c){
    el('kenh').textContent = c.kenh;
    var a = C.DIEM.filter(function(p){ return p.id === c.tu; })[0], b = C.DIEM.filter(function(p){ return p.id === c.den; })[0];
    if (a && b) el('tb-tuyen').textContent = 'Báo cho tuyến ' + a.ten + ' → ' + b.ten + ' lúc 6h sáng, và ngay khi có biển động mới.';
  }).catch(function(){});
})();
</script>
</body>
</html>
